# Training entry point

defaults:
  - env: default
  - data: pascal_voc
  - model: default
  - training: default
  - logging: default
  - override hydra/job_logging: experiment
  - _self_

# Hydra configuration to use custom output directory
hydra:
  run:
    dir: ${oc.env:NNI_OUTPUT_DIR,${oc.env:LOG_ROOT}/${now:%Y_%m_%d-%H_%M_%S}}

# Environment Settings
env:
  gpu_id: 0
  seed: 1