# Visualization entry point: load a trained checkpoint and render prototype images.
# Point model.checkpoint at a checkpoint (and reuse its training run's `.hydra/config.yaml`
# via `--config-path=<run_dir>/.hydra --config-name=config` to match the exact architecture).

defaults:
  - env: default
  - data: pascal_voc
  - model: default
  - visualization: default
  - logging: default
  - override hydra/job_logging: experiment
  - _self_

hydra:
  run:
    dir: ${oc.env:LOG_ROOT}/${now:%Y_%m_%d-%H_%M_%S}

env:
  gpu_id: 0
  seed: 1